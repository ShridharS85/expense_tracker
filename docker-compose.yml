# Context is an path where u stored dockerfile
# Change mysql host port number to 3307 because i installed mysql in windows that uses 3306 
# so docker needs free port 


services:

  # =========================================
  # MYSQL
  # =========================================

  mysql:
    image: mysql:8.4
    container_name: expense-tracker-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================================
  # SPRING BOOT BACKEND
  # =========================================

  backend:
    build:
      context: ./expense_tracker_backend/expense_tracker_backend
      dockerfile: Dockerfile

    container_name: expense-tracker-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      FRONTEND_URL: ${FRONTEND_URL}

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy


  # =========================================
  # REACT FRONTEND
  # =========================================

  frontend:
    build:
      context: ./expense_tracker_frontend
      dockerfile: Dockerfile

    container_name: expense-tracker-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


# =========================================
# MYSQL VOLUME
# =========================================

volumes:
  mysql_data: